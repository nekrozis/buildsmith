name: package

on:
  workflow_call:
    inputs:
      package:
        description: Directory name under packages/
        type: string
        required: true
      pkgver:
        description: Override version.pkgver from the recipe
        type: string
        required: false
        default: ""
      pkgrel:
        description: Override version.pkgrel from the recipe (empty or 0 keeps the recipe value)
        type: string
        required: false
        default: ""
      arch:
        description: Override the first entry of arch in the recipe
        type: string
        required: false
        default: ""
    outputs:
      tag:
        description: Release tag this build would be published under
        value: ${{ jobs.plan.outputs.tag }}
      name:
        description: Package name
        value: ${{ jobs.plan.outputs.name }}
      full:
        description: "<pkgver>-<pkgrel>"
        value: ${{ jobs.plan.outputs.full }}
      publishable:
        description: "true when distribution is allowed"
        value: ${{ jobs.plan.outputs.publishable }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      ids: ${{ steps.plan.outputs.ids }}
      tag: ${{ steps.plan.outputs.tag }}
      name: ${{ steps.plan.outputs.name }}
      full: ${{ steps.plan.outputs.full }}
      publishable: ${{ steps.plan.outputs.publishable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Resolve plan
        id: plan
        env:
          PACKAGE: ${{ inputs.package }}
          PKGVER: ${{ inputs.pkgver }}
          PKGREL: ${{ inputs.pkgrel }}
          ARCH: ${{ inputs.arch }}
          PYTHON: python
        run: |
          set -euo pipefail
          python tools/pkgctl.py plan > plan.json
          cat plan.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          plan = json.load(open("plan.json", encoding="utf-8"))
          print("plan=" + json.dumps(plan, separators=(",", ":")))
          print("tag={}/v{}".format(plan["name"], plan["full"]))
          print("name=" + plan["name"])
          print("full=" + plan["full"])
          print("publishable=" + str(plan["publishable"]).lower())
          PY
          echo "ids=$(python tools/pkgctl.py plan --ids)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runner }}
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE: ${{ inputs.package }}
      PKGVER: ${{ inputs.pkgver }}
      PKGREL: ${{ inputs.pkgrel }}
      ARCH: ${{ inputs.arch }}
      BUILD_ID: ${{ matrix.id }}
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Set up Go
        if: fromJSON(needs.plan.outputs.plan).toolchain.go != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ fromJSON(needs.plan.outputs.plan).toolchain.go }}
          cache: false
      - name: Set up Rust
        if: fromJSON(needs.plan.outputs.plan).toolchain.rust != ''
        run: rustup toolchain install "${{ fromJSON(needs.plan.outputs.plan).toolchain.rust }}" --profile minimal
      - name: Set up MSVC
        if: fromJSON(needs.plan.outputs.plan).vcvars
        uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        with:
          arch: x64
      - name: Resolve sources
        run: python tools/pkgctl.py fetch --id $env:BUILD_ID --work "$env:RUNNER_TEMP/work"
      - name: Build
        run: python tools/pkgctl.py build --id $env:BUILD_ID --work "$env:RUNNER_TEMP/work"
      - name: Smoke test
        run: python tools/pkgctl.py smoke --id $env:BUILD_ID --work "$env:RUNNER_TEMP/work"
      - name: Package
        run: python tools/pkgctl.py package --id $env:BUILD_ID --work "$env:RUNNER_TEMP/work" --out "$env:RUNNER_TEMP/dist/$env:BUILD_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.id }}
          path: ${{ runner.temp }}/dist/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Assemble and compare
        env:
          IDS: ${{ needs.plan.outputs.ids }}
          PACKAGE: ${{ inputs.package }}
          PKGVER: ${{ inputs.pkgver }}
          PKGREL: ${{ inputs.pkgrel }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          ids="$(python -c 'import json, os; print(",".join(json.loads(os.environ["IDS"])))')"
          python tools/pkgctl.py assemble --ids "${ids}" --out dist
          ls -l dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/*
          if-no-files-found: error
          retention-days: 7