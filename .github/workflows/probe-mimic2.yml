name: probe-mimic2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/package.yml
    with:
      package: __probe__
    permissions:
      contents: read
      id-token: write
      attestations: write
  publish:
    if: inputs.publish
    needs: build
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      publishable: ${{ needs.build.outputs.publishable }}
    permissions:
      contents: write
      id-token: write
      attestations: write
