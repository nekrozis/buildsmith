name: probe

# Temporary diagnostic workflow: calls the reusable package workflow with a
# nonexistent package so the plan step fails fast, and compares a call with and
# without a job-level permissions block. Deleted once the failure is understood.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calls_plain:
    uses: ./.github/workflows/package.yml
    with:
      package: __probe__

  calls_perm:
    uses: ./.github/workflows/package.yml
    with:
      package: __probe__
    permissions:
      contents: read
      id-token: write
      attestations: write