name: diag-skia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Probe the Skia release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $url = 'https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip'
          $asset = 'https://api.github.com/repos/aseprite/skia/releases/assets/173170506'
          $cases = [ordered]@{
            'range-1mb'  = @('-r', '0-1048575', $url)
            'full-v4'    = @('-4', $url)
            'full-v6'    = @('-6', $url)
            'api-asset'  = @('-H', 'Accept: application/octet-stream', $asset)
            'head'       = @('-I', $url)
          }
          foreach ($name in $cases.Keys) {
            $args = $cases[$name]
            $out = & curl.exe -sS -L --max-time 60 -o NUL -w '%{http_code} %{size_download} %{url_effective}' @args 2>&1
            Write-Host "== $name -> $out"
          }
          & curl.exe -sS -I -L --max-time 60 $url 2>&1 | Select-Object -First 12
          Write-Host "curl version:"; & curl.exe --version
