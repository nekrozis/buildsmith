name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Validate recipes
        run: python tools/pkgctl.py validate --all
      - name: Lint workflows
        run: python tools/pkgctl.py lint-workflows
      - name: Run tool tests
        run: python tools/test_pkgctl.py