name: jaq
summary: A jq clone focused on correctness, speed and simplicity
homepage: https://github.com/01mf02/jaq
license: MIT

version:
  pkgver: "3.2.0"
  pkgrel: 1

arch: [amd64v3]

sources:
  - type: git
    url: https://github.com/01mf02/jaq.git
    tag: v${pkgver}
    commit: 0ee33bbcf44aed00c91748071e5031e8a5410339
    dir: jaq

build:
  script: build.ps1
  shell: pwsh
  runner: windows-2025
  toolchain:
    rust: "1.100.0"
    msvc: "18"
  env:
    RUSTUP_TOOLCHAIN: "1.100.0"
    RUSTFLAGS: "-C target-cpu=x86-64-v3"
    _CL_: "/arch:AVX2 /O2 /Ob2 /DNDEBUG /Brepro"
    _LINK_: "/INCREMENTAL:NO /OPT:REF,ICF /Brepro"

stage:
  - from: ${out}
    to: bin

smoke:
  - [bin/jaq.exe, --version]

reproducibility:
  level: L2
  ab: true
  cross_env: false
  verified_on: [windows-2025]

distribution: allowed

notes: >-
  Builds the jaq binary from the upstream workspace; jaq-play (the egui
  playground) is not built. The default mimalloc allocator is kept, and its C
  source is compiled with MSVC as part of the build.
