name: gdu
summary: Pretty fast disk usage analyzer written in Go
homepage: https://github.com/dundee/gdu
license: MIT

version:
  pkgver: 5.39.0
  pkgrel: 1

arch: [amd64v3]

sources:
  - type: git
    url: https://github.com/dundee/gdu.git
    tag: v${pkgver}
    commit: e09ee9a20d1d9351e90e84ec3f86ab7bbcddbeea
    dir: gdu

build:
  script: build.ps1
  shell: pwsh
  runner: windows-2025
  toolchain:
    go: "1.27.4"
  env:
    CGO_ENABLED: "0"
    GOOS: windows
    GOARCH: amd64
    GOAMD64: v3
    GOFLAGS: "-buildvcs=false -trimpath -pgo=default.pgo"
  # Upstream's release workflow runs `make build-all`; its Windows build lines
  # pass no GOFLAGS, so the official windows/amd64 exe gets neither PGO nor PIE.
  # Version metadata and the embedded web UI are repository build mechanics.
  overrides:
    - "PGO uses the committed `default.pgo`; upstream's Windows release build runs `go build` without GOFLAGS, so the official `gdu_windows_amd64.exe` is not PGO."

stage:
  - from: ${out}
    to: bin

smoke:
  - [bin/gdu.exe, --version]

reproducibility:
  level: L2
  ab: true
  cross_env: false
  verified_on: [windows-2025]

distribution: allowed
runtime: "Static Go binary; no Visual C++ Redistributable required."
notes: >-
  Built with PGO from the profile committed in the source tree, with the
  web UI embedded. Version metadata is fixed at build time, so --version is
  byte-stable for a given recipe.