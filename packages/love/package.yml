name: love
summary: 2D game framework for Lua
homepage: https://love2d.org
license: zlib

version:
  pkgver: "11.5"
  pkgrel: 3

arch: [amd64v3]

sources:
  - type: git
    url: https://github.com/love2d/love.git
    tag: ${pkgver}
    commit: 6eb8d546736d5915a8b5af30b2cf33456dfdcb1a
    dir: love
  - type: git
    url: https://github.com/love2d/megasource.git
    tag: ${pkgver}
    commit: 48811d08a8edecea05c117022a38a91dd10f46f6
    dir: megasource
  # openresty/luajit2 is what Debian stable ships as luajit. This commit is the
  # tree behind Debian trixie's 2.1.0+openresty20250117 orig tarball, matched by
  # diffing the tarball against the commit (doc/ excluded). The fork has no
  # tags, so only the commit pins it.
  - type: git
    url: https://github.com/openresty/luajit2.git
    commit: 93162f34e7424cd0ea3c4046a9ffacce621626bc
    dir: luajit

build:
  script: build.ps1
  shell: pwsh
  runner: windows-2025
  toolchain:
    msvc: "18"
    zig: "0.17.1"
  env:
    _LINK_: "/INCREMENTAL:NO /OPT:REF,ICF /Brepro"
    ZIG_TARGET: x86_64-windows-msvc
    ZIG_CPU: x86_64_v3
  overrides:
    - "MSVC /arch:AVX2 (x86-64-v3) for all CMake-built modules; upstream Windows builds use the baseline SSE2 target"
    - "dynamic CRT (/MD) and no CRT files in the archive: target machines need the matching VC++ Redistributable"
    - "no /fp:fast; the MSVC default /fp:precise is kept for Lua and Box2D floating-point behavior"
    - "MSVC /GL and /LTCG are enabled for CMake-built code"
    - "LuaJIT, SDL2, mpg123 and OpenAL Soft stay DLLs; zlib, libogg, libvorbis, libtheora, FreeType and libmodplug are linked into love.dll"
    - "the megasource 11.5 layout already provides the intended 2+2 split; only the LuaJIT-prebuilt and OpenAL native-tools CMake fixes are patched"
    - "LuaJIT comes from openresty/luajit2 @ 93162f3 (v2.1-agentzh, merge dated 2025-01-17), the tree Debian trixie ships as 2.1.0+openresty20250117; the pin was verified by diffing the Debian orig tarball against the commit (doc/ excluded)"
    - "the LuaJIT pin follows the luajit source version in Debian stable main (not backports, sid or testing): a new snapshot moves the commit, and a revision-only bump is re-checked for security patches"
    - "LuaJIT is compiled by zig cc for the msvc target (-mcpu=x86_64_v3 -O2 -DNDEBUG): clang generates the same code for the same input, which the MSVC backend does not; zig uses the runner's MSVC headers and CRT, so this part is not hermetic"
    - "the LuaJIT version string is 2.1.<commit time>: the fork ships .relver as an unexpanded $Format:%ct$ placeholder, so the build writes luajit_relver.txt from the pinned commit"
    - "LuaJIT is consumed as prebuilt lua51.lib/lua51.dll/include via MEGA_LUAJIT_PREBUILT_DIR; its sources are not integrated into love.dll"
    - "with /GL and /LTCG, /experimental:deterministic is passed to the linker as well as the compiler; the flag is undocumented, but link-time code generation was where rebuilds diverged"
    - "the package is amd64v3 because love.dll and the CMake-built DLLs use /arch:AVX2; LuaJIT is compiled with -mcpu=x86_64_v3, the same v3 feature level"

stage:
  - from: ${out}/bin
    to: bin
  - from: ${out}/license.txt
    to: license.txt

smoke:
  - [bin/love.exe, --version]

reproducibility:
  level: L2
  ab: true
  cross_env: false
  verified_on: [windows-2025]

distribution: allowed
notes: >-
  LÖVE 11.5, built from the 11.5 tags of love and megasource. LuaJIT, SDL2,
  mpg123 and OpenAL Soft are shipped as DLLs; zlib, libogg, libvorbis,
  libtheora, FreeType and libmodplug are linked into love.dll. LuaJIT comes
  from openresty/luajit2 at the Debian stable snapshot and is compiled with
  zig cc, then fed to the build as a prebuilt lua51.lib/lua51.dll. The
  Microsoft VC++ runtime is not bundled; install the matching VC++
  Redistributable. license.txt is included; mpg123 (LGPL-2.1) and OpenAL Soft
  (LGPL-2.0+) remain separate DLLs.
