name: nushell
summary: A new type of shell
homepage: https://www.nushell.sh
license: MIT

version:
  pkgver: 0.117.0
  pkgrel: 2

arch: [amd64v3]

sources:
  - type: git
    url: https://github.com/nushell/nushell.git
    tag: ${pkgver}
    commit: a4819256a2d875ca42c8600242388da291f3beaa
    dir: nushell

build:
  script: build.ps1
  shell: pwsh
  runner: windows-2025
  toolchain:
    rust: "1.100.0"
  env:
    RUSTUP_TOOLCHAIN: "1.100.0"
    RUSTFLAGS: "-C target-cpu=x86-64-v3"
    _CL_: "/arch:AVX2 /O2 /Ob2 /DNDEBUG"
    _LINK_: "/INCREMENTAL:NO /OPT:REF,ICF /Brepro"
  overrides:
    - "RUSTFLAGS=-C target-cpu=x86-64-v3"
    - "MSVC /arch:AVX2 and /O2 /Ob2 /DNDEBUG apply to C dependencies; Rust uses target-cpu=x86-64-v3"
    - "profile make: inherits release, lto=fat, codegen-units=1, panic=unwind, no incremental"
    - "upstream rust-toolchain.toml and .cargo/ dropped, built with stable rustc instead"

stage:
  - from: ${out}
    to: bin

smoke:
  - [bin/nu.exe, --version]

reproducibility:
  level: L0
  ab: false
  cross_env: false
  verified_on: []

distribution: allowed