name: lazygit
summary: Simple terminal UI for git commands
homepage: https://github.com/jesseduffield/lazygit
license: MIT

version:
  pkgver: 0.66.3
  pkgrel: 1

arch: [amd64v3]

sources:
  - type: git
    url: https://github.com/jesseduffield/lazygit.git
    tag: v${pkgver}
    commit: e0fbfd50c36e1ef88c52297ca34750e640b4f5f4
    dir: lazygit

build:
  script: build.ps1
  shell: pwsh
  runner: windows-2025
  toolchain:
    go: "1.27.3"
  env:
    CGO_ENABLED: "0"
    GOOS: windows
    GOARCH: amd64
    GOAMD64: v3
    GOFLAGS: "-buildvcs=false -trimpath"
  overrides:
    - "GOAMD64=v3, upstream goreleaser builds windows/amd64 with the default v1"

stage:
  - from: ${out}
    to: bin

smoke:
  - [bin/lazygit.exe, --version]

reproducibility:
  level: L3
  ab: true
  cross_env: true
  verified_on: [windows-2025]

distribution: allowed