name: aseprite
summary: Animated sprite editor and pixel art tool
homepage: https://www.aseprite.org
license: Aseprite-EULA

version:
  pkgver: 1.3.18.6
  pkgrel: 1

arch: [amd64v3]

sources:
  - type: git
    url: https://github.com/aseprite/aseprite.git
    tag: v${pkgver}
    commit: 331e898ef405d919539c03fd1675691cfa16c3a3
    dir: aseprite
    submodules: true
  # Same bytes as
  #   https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
  # but that redirect answered 504 from GitHub's own edge on 2026-11-08 while the
  # asset route served the file. The id is opaque only until the sha256 below
  # pins the content, so an upstream re-upload cannot change what we build.
  - type: url
    url: https://api.github.com/repos/aseprite/skia/releases/assets/173170506
    accept: application/octet-stream
    sha256: 5a371a4b2819bb4eb96e36cd75fa623585e1d5477e253a970302b6f2471b6934
    extract: zip
    dir: skia

build:
  script: build.ps1
  shell: pwsh
  runner: windows-2025
  toolchain:
    msvc: "17"
  env:
    _LINK_: "/INCREMENTAL:NO /OPT:REF,ICF /Brepro"
  overrides:
    - "MSVC /arch:AVX2 (implies AVX/SSE4.2 and enables FMA), /fp:fast, static /MT CRT"
    - "optimisation lives in CMAKE_C_FLAGS_RELEASE/CMAKE_CXX_FLAGS_RELEASE, not in CL/_CL_: those also hit CMake's configure-time try-compiles and collide with /RTC1"
    - "LAF_BACKEND=skia with the pinned aseprite/skia prebuilt library"
    - "Sentry, news, updater and DRM disabled"
    - "whole-program optimisation (/GL + /LTCG) is off: it inflates app-lib.lib past lib.exe's 4 GiB archive limit (LNK1248) with MSVC 14.51 on windows-2025-vs2026"

stage:
  - from: ${out}
    to: bin

smoke:
  - [bin/aseprite.exe, --version]

reproducibility:
  level: L2
  ab: false
  cross_env: false
  verified_on: [windows-2025]

distribution: private-only
notes: >-
  The Aseprite EULA allows building from source for personal use but does not
  permit redistributing compiled binaries. This recipe is kept so the build can
  be reproduced locally; it is excluded from the public index and must not be
  published to any mirror.