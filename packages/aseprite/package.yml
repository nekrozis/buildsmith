name: aseprite
summary: Animated sprite editor and pixel art tool
homepage: https://www.aseprite.org
license: Aseprite-EULA

version:
  pkgver: 1.3.18.6
  pkgrel: 2

arch: [amd64v3]

sources:
  - type: git
    url: https://github.com/aseprite/aseprite.git
    tag: v${pkgver}
    commit: 331e898ef405d919539c03fd1675691cfa16c3a3
    dir: aseprite
    submodules: true
  # Same bytes as
  #   https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
  # but that redirect answered 504 from GitHub's own edge on 2026-11-08 while the
  # asset route served the file. The id is opaque only until the sha256 below
  # pins the content, so an upstream re-upload cannot change what we build.
  #
  # The asset route is an API call, and api.github.com allows 60 unauthenticated
  # requests per hour per address, which a hosted runner shares with every other
  # job; 9 retries in a row answered 403 on 2026-11-15. auth: github sends the job
  # token, and the token is never written to the log or the manifest.
  - type: url
    url: https://api.github.com/repos/aseprite/skia/releases/assets/173170506
    accept: application/octet-stream
    auth: github
    sha256: 5a371a4b2819bb4eb96e36cd75fa623585e1d5477e253a970302b6f2471b6934
    extract: zip
    dir: skia

build:
  script: build.ps1
  shell: pwsh
  runner: windows-2025
  toolchain:
    msvc: "18"
  env:
    _LINK_: "/INCREMENTAL:NO /OPT:REF,ICF /Brepro"
  # The static /MT CRT and the aseprite/skia prebuilt library match upstream:
  # CMakeLists.txt sets CMAKE_MSVC_RUNTIME_LIBRARY, and laf/misc/skia-url.sh
  # fetches the same asset. Optimisation lives in CMAKE_C_FLAGS_RELEASE rather
  # than CL/_CL_ because those also hit CMake's try-compiles and collide with
  # /RTC1. OpenSSL is disabled, not deleted; dumpbin fails the build if
  # libcrypto/libssl still shows up.
  overrides:
    - "News and update checks are disabled; upstream's CMake defaults enable both."

stage:
  - from: ${out}
    to: bin

smoke:
  - [bin/aseprite.exe, --version]

reproducibility:
  level: L2
  ab: true
  cross_env: false
  verified_on: [windows-2025]

distribution: private-only
runtime: "Static CRT; no Visual C++ Redistributable required."
notes: >-
  The Aseprite EULA allows building from source for personal use but does not
  permit redistributing compiled binaries. This recipe is kept so the build can
  be reproduced locally; it is excluded from the public index and must not be
  published to any mirror. Built without /GL + /LTCG: whole-program
  optimisation pushes app-lib.lib past lib.exe's 4 GiB archive limit (LNK1248).