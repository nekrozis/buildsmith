name: wasmtime
summary: Standalone WebAssembly runtime with a CLI
homepage: https://wasmtime.dev/
license: Apache-2.0 WITH LLVM-exception

version:
  pkgver: "51.0.0"
  pkgrel: 1

arch: [amd64v3]

sources:
  - type: git
    url: https://github.com/bytecodealliance/wasmtime.git
    tag: v${pkgver}
    commit: 32656dc4873fcec5c8662aa937bd01acda3b2e85
    dir: wasmtime

build:
  script: build.ps1
  shell: pwsh
  runner: windows-2025
  toolchain:
    rust: "1.100.0"
    msvc: "18"
  env:
    RUSTUP_TOOLCHAIN: "1.100.0"
    RUSTFLAGS: "-C target-cpu=x86-64-v3 -C target-feature=+crt-static"
    _CL_: "/arch:AVX2 /O2 /Ob2 /DNDEBUG /Brepro"
    _LINK_: "/INCREMENTAL:NO /OPT:REF,ICF /Brepro"

stage:
  - from: ${out}
    to: bin

smoke:
  - [bin/wasmtime.exe, --version]

reproducibility:
  level: L2
  ab: true
  cross_env: false
  verified_on: [windows-2025]

distribution: allowed
runtime: "Static CRT; no Visual C++ Redistributable required."

notes: >-
  Builds the wasmtime CLI with all-arch, component-model and run. The profile
  is lto=fat with codegen-units=1, the same shape as upstream's own
  fastest-runtime profile and Homebrew's build; upstream's Windows release
  keeps the default release profile (no LTO, 16 codegen units) because CI time
  is its bottleneck. gdbstub is not enabled, matching the distribution
  packages (Arch, Homebrew, Alpine, Nixpkgs all build default features), so
  wasmtime run -g is unavailable. Static CRT, panic=abort and strip=debuginfo
  match the upstream release build. The default
  features pull four C libraries — ring, zstd, capstone and ittapi — which are
  compiled with MSVC here; ring links the COFF objects it ships pregenerated
  instead of assembling them, so no nasm or perl is involved.
