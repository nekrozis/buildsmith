name: ripgrep
summary: Line-oriented search tool that recursively searches for a regex pattern
homepage: https://github.com/BurntSushi/ripgrep
license: Unlicense OR MIT

version:
  pkgver: 15.2.0
  pkgrel: 1

arch: [amd64v3]

sources:
  - type: git
    url: https://github.com/BurntSushi/ripgrep.git
    tag: ${pkgver}
    commit: e89fff89ac9af12e8d4ce9d5fd07beb408ca730f
    dir: ripgrep

build:
  script: build.ps1
  shell: pwsh
  runner: windows-2025
  toolchain:
    rust: "1.99.1"
    msvc: "17"
  env:
    RUSTUP_TOOLCHAIN: "1.99.1"
    RUSTFLAGS: "-C target-cpu=x86-64-v3 -C target-feature=+crt-static"
    _LINK_: "/INCREMENTAL:NO /OPT:REF,ICF /Brepro"
  overrides:
    - "RUSTFLAGS=-C target-cpu=x86-64-v3 -C target-feature=+crt-static, upstream release builds windows/amd64 with the default x86-64 baseline"
    - "PCRE2 is enabled (--features pcre2), matching upstream release binaries and Microsoft's ripgrep-prebuilt; pcre2-sys builds the bundled C library with MSVC"
    - "upstream .cargo/config.toml is dropped; its +crt-static flag is kept explicitly in RUSTFLAGS so the exe has no vcruntime DLL dependency"
    - "profile make: inherits release, lto=fat, codegen-units=1, strip=debuginfo, no incremental"

stage:
  - from: ${out}
    to: bin

smoke:
  - [bin/rg.exe, --version]

reproducibility:
  level: L2
  ab: true
  cross_env: false
  verified_on: [windows-2025]

distribution: allowed
notes: >-
  Built with PCRE2 support, so -P/--pcre2 and --auto-hybrid-regex work.
  PCRE2 is linked statically, like the rest of the C runtime.
